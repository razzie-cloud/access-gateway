<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minimal WebAuthn</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@2/css/pico.min.css">
</head>
<body>
<main class="container">
  <hgroup>
    <h1>Minimal WebAuthn</h1>
    <p>No passwords. One first-user bootstrap. WebAuthn only.</p>
  </hgroup>

  <article id="status" aria-busy="false"></article>

  <article id="registerBox" style="display:none;">
    <h3>First user registration</h3>
    <p>Registration is enabled only when there are no users. You need the bootstrap token from backend logs.</p>
    <label>
      Username
      <input id="regUser" autocomplete="username" />
    </label>
    <label>
      Bootstrap token
      <input id="regToken" autocomplete="off" />
    </label>
    <button id="regBtn">Register with WebAuthn</button>
  </article>

  <article id="loginBox" style="display:none;">
    <h3>Login</h3>
    <label>
      Username
      <input id="loginUser" autocomplete="username" />
    </label>
    <button id="loginBtn">Login with WebAuthn</button>
    <hr />
    <button class="secondary" id="meBtn">Who am I?</button>
    <button class="secondary" id="logoutBtn">Logout</button>
  </article>
</main>

<script>
const $ = (id) => document.getElementById(id);

function setStatus(msg, busy=false) {
  const el = $("status");
  el.setAttribute("aria-busy", busy ? "true" : "false");
  el.textContent = msg;
}

function b64urlToBuf(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  const pad = s.length % 4;
  if (pad) s += "=".repeat(4 - pad);
  const bin = atob(s);
  const buf = new ArrayBuffer(bin.length);
  const arr = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return buf;
}

function bufToB64url(buf) {
  const arr = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function prepCreationOptions(o) {
  o.publicKey.challenge = b64urlToBuf(o.publicKey.challenge);
  o.publicKey.user.id = b64urlToBuf(o.publicKey.user.id);
  if (o.publicKey.excludeCredentials) {
    o.publicKey.excludeCredentials = o.publicKey.excludeCredentials.map(c => ({...c, id: b64urlToBuf(c.id)}));
  }
  return o;
}

function prepRequestOptions(o) {
  o.publicKey.challenge = b64urlToBuf(o.publicKey.challenge);
  if (o.publicKey.allowCredentials) {
    o.publicKey.allowCredentials = o.publicKey.allowCredentials.map(c => ({...c, id: b64urlToBuf(c.id)}));
  }
  return o;
}

function packAttestationResponse(cred) {
  return {
    id: cred.id,
    rawId: bufToB64url(cred.rawId),
    type: cred.type,
    response: {
      clientDataJSON: bufToB64url(cred.response.clientDataJSON),
      attestationObject: bufToB64url(cred.response.attestationObject),
    },
    clientExtensionResults: cred.getClientExtensionResults(),
  };
}

function packAssertionResponse(cred) {
  return {
    id: cred.id,
    rawId: bufToB64url(cred.rawId),
    type: cred.type,
    response: {
      clientDataJSON: bufToB64url(cred.response.clientDataJSON),
      authenticatorData: bufToB64url(cred.response.authenticatorData),
      signature: bufToB64url(cred.response.signature),
      userHandle: cred.response.userHandle ? bufToB64url(cred.response.userHandle) : null,
    },
    clientExtensionResults: cred.getClientExtensionResults(),
  };
}

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : null,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

async function bootstrap() {
  setStatus("Checking state…", true);
  const res = await fetch("/api/bootstrap");
  const data = await res.json();
  $("registerBox").style.display = data.needsRegistration ? "" : "none";
  $("loginBox").style.display = data.needsRegistration ? "none" : "";
  setStatus(data.needsRegistration ? "No users found. Registration is enabled." : "Ready.", false);
}

$("regBtn").addEventListener("click", async () => {
  try {
    setStatus("Starting registration…", true);
    const username = $("regUser").value.trim();
    const token = $("regToken").value.trim();
    const opts = await api("/api/register/begin", {username, token});
    const creation = prepCreationOptions(opts);
    const cred = await navigator.credentials.create(creation);
    const payload = packAttestationResponse(cred);
    const res = await fetch("/api/register/finish", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ("HTTP " + res.status));
    setStatus("Registered. Reloading state…", false);
    await bootstrap();
  } catch (e) {
    setStatus("Registration failed: " + e.message, false);
  }
});

$("loginBtn").addEventListener("click", async () => {
  try {
    setStatus("Starting login…", true);
    const username = $("loginUser").value.trim();
    const opts = await api("/api/login/begin", {username});
    const req = prepRequestOptions(opts);
    const cred = await navigator.credentials.get(req);
    const payload = packAssertionResponse(cred);
    const res = await fetch("/api/login/finish", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ("HTTP " + res.status));
    setStatus("Logged in.", false);
  } catch (e) {
    setStatus("Login failed: " + e.message, false);
  }
});

$("meBtn").addEventListener("click", async () => {
  const res = await fetch("/api/me");
  const data = await res.json();
  setStatus(data.authenticated ? ("Authenticated as: " + data.username) : "Not authenticated.", false);
});

$("logoutBtn").addEventListener("click", async () => {
  await fetch("/api/logout", {method:"POST"});
  setStatus("Logged out.", false);
});

bootstrap();
</script>
</body>
</html>
