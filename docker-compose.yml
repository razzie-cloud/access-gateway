services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
      ORIGIN: http://localhost:8080
      RP_ID: localhost
      RP_NAME: Minimal WebAuthn
      LISTEN_ADDR: :8080
    command: ["sh", "-c", "go mod tidy && go run ./cmd/server"]
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
