name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway-test-only
          POSTGRES_DB: gateway_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gateway_test" --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:9.1.0
        ports: ["6379:6379"]
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://gateway_test:gateway-test-only@127.0.0.1:5432/gateway_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t access-gateway:test .
