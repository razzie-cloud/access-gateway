name: Publish image

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.created && !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare image reference
        id: image
        shell: bash
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$GIT_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Git tag must be a valid Docker image tag (1–128 letters, digits, underscores, dots, or hyphens; cannot start with a dot or hyphen)."
            exit 1
          fi
          printf 'ref=ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "$GIT_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
